<style>
/* Concept: a HUD console. Blueprint grid fading from the top, glass panels with corner brackets, cyan-to-mint glow on active controls. White by default; the sun/moon button in the top bar switches to dark. The output console stays dark in both themes. */
:root {
  color-scheme: light;
  --bg: #f2f6fa;
  --panel: rgba(255, 255, 255, 0.86);
  --top: rgba(255, 255, 255, 0.84);
  --field: #f5f8fc;
  --ink: #0c1a2b;

  --line: rgba(20, 80, 140, 0.14);
  --line-strong: rgba(0, 150, 190, 0.42);
  --grid: rgba(20, 100, 170, 0.07);
  --hero-glow: rgba(0, 180, 216, 0.16);
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 14px 38px rgba(20, 60, 110, 0.1);
  --accent: #00a9cc;
  --accent-2: #12c98a;
  --accent-text: #0a7a96;
  --mint-text: #0b8a60;
  --accent-ink: #03121a;
  --accent-soft: rgba(0, 169, 204, 0.1);
  --glow: rgba(0, 169, 204, 0.3);
  --console: #08111c;
  --console-ink: #9ff3ff;
  --console-dim: #587489;
  --warn: #c2410c;
  --font-head: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #060a12;
  --panel: rgba(13, 21, 36, 0.78);
  --top: rgba(6, 10, 18, 0.8);
  --field: #080e1a;
  --ink: #e6f2ff;
  --muted: #8aa1b9;
  --line: rgba(110, 190, 255, 0.16);
  --line-strong: rgba(90, 225, 255, 0.45);
  --grid: rgba(110, 190, 255, 0.06);
  --hero-glow: rgba(38, 224, 255, 0.16);
  --shadow: 0 0 0 1px rgba(255, 255, 255, 0.02) inset, 0 20px 50px rgba(0, 0, 0, 0.45);
  --accent: #26e0ff;
  --accent-2: #4dffb4;
  --accent-text: #26e0ff;

<script>
//#logic-start
// A CNIC is exactly 13 digits: either 5-7-1 with both dashes, or 13 plain digits.
// Anything touching more digits (or a dash joined to more digits) is rejected.
// Never a CNIC: anything starting with 92 (country code), and plain 13-digit values
// starting 38 + 03 (38 followed by a local 03xx network code, such as 0310..0319 or 0300).
const CNIC_RE = /(?<!\d)(?<!\d-)(?!92)(?:\d{5}-\d{7}-\d|(?!3803)\d{13})(?!-?\d)/g;
const PHONE_RE = /(?<!\d)(?<!\d-)(?:\+? ?92[ -]?|0092[ -]?|38[ -]?0|0)?(3\d{2})[ -]?(\d{7})(?!-?\d)/g;

function extractCnic(text, opts) {
  const dashes = !opts || opts.dashes !== false;
  const dedupe = !opts || opts.dedupe !== false;
  const all = Array.from(text.matchAll(CNIC_RE), function (m) {
    const d = m[0].replace(/\D/g, '');
    return dashes ? d.slice(0, 5) + '-' + d.slice(5, 12) + '-' + d.slice(12) : d;
  });
  const list = dedupe ? Array.from(new Set(all)) : all;
  return { list: list, total: all.length };
}

function extractNumbers(text, opts) {
  const dedupe = !opts || opts.dedupe !== false;
  const rest = text.replace(CNIC_RE, '\n');
  const all = Array.from(rest.matchAll(PHONE_RE), function (m) { return m[1] + m[2]; });
  const list = dedupe ? Array.from(new Set(all)) : all;
  return { list: list, total: all.length };
}

function formatNumbers(list, fmt) {
  if (fmt === 'lines') return list.join('\n');
  return list.map(function (n) { return "'" + n + "'"; }).join(',');
}
//#logic-end

const $ = function (id) { return document.getElementById(id); };
let mode = 'cnic';
let lastList = [];

/* theme: white by default, remembered if the viewer switches */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark';
  $('theme').setAttribute('aria-label', dark ? 'Switch to white theme' : 'Switch to dark theme');
}
(function () {
  let saved = null;
  try { saved = localStorage.getItem('cnic-theme'); } catch (e) { saved = null; }
  applyTheme(saved === 'dark' ? 'dark' : 'light');
})();
$('theme').addEventListener('click', function () {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('cnic-theme', next); } catch (e) { /* storage unavailable */ }
});

function setNote(msg, isErr) {
  const n = $('note');
  n.textContent = msg || '';
  n.className = 'note' + (isErr ? ' err' : '');
}

function showMessage(msg, isErr) {
  $('sum').hidden = false;
  $('count').hidden = true;
  $('c-dups').hidden = true;
  const s = $('stats');
  s.hidden = false;
  s.textContent = msg;
  s.className = isErr ? 'err' : '';
}

function syncMode() {
  const isCnic = mode === 'cnic';
  $('m-cnic').setAttribute('aria-pressed', String(isCnic));
  $('m-num').setAttribute('aria-pressed', String(!isCnic));
  $('o-cnic').hidden = !isCnic;
  $('o-num').hidden = isCnic;
  $('tag').textContent = isCnic ? 'cnic' : 'numbers';
}

function run(nextMode) {
  if (nextMode) mode = nextMode;
  syncMode();
  const isCnic = mode === 'cnic';
  const text = $('data').value;
  if (!text.trim()) {
    $('out').value = '';
    lastList = [];
    showMessage('Paste data or choose a file first.', true);
    return;
  }
  const dedupe = $('dedupe').checked;
  let res, out;
  if (isCnic) {
    res = extractCnic(text, { dashes: $('cnic-fmt').value === 'dash', dedupe: dedupe });
    out = res.list.join('\n');
  } else {
    res = extractNumbers(text, { dedupe: dedupe });
    out = formatNumbers(res.list, $('num-fmt').value);
  }
  $('out').value = out;
  lastList = res.list.slice();
  const n = res.list.length;
  if (!n) {
    showMessage(isCnic
      ? 'No CNICs found. A CNIC must have exactly 13 digits, with or without dashes.'
      : 'No mobile numbers found. Numbers should start with 03, 92 or 3, for example 0300-6547399.', true);
    return;
  }
  const dups = res.total - n;
  $('sum').hidden = false;
  $('stats').hidden = true;
  $('count').hidden = false;
  $('n-found').textContent = n.toLocaleString();
  $('n-label').textContent = isCnic ? (n === 1 ? 'CNIC found' : 'CNICs found') : (n === 1 ? 'number found' : 'numbers found');
  $('n-dups').textContent = dups.toLocaleString();
  $('c-dups').hidden = dups <= 0;
}

function workbookToText(wb) {
  const lines = [];
  let cells = 0;
  wb.SheetNames.forEach(function (name) {
    const ws = wb.Sheets[name];
    if (!ws) return;
    let lastRow = -1;
    let line = [];
    Object.keys(ws).forEach(function (key) {
      if (key.charAt(0) === '!') return;
      const c = ws[key];
      if (!c || c.v === undefined || c.v === null || c.v === '') return;
      const pos = XLSX.utils.decode_cell(key);
      if (pos.r !== lastRow) {
        if (line.length) lines.push(line.join('\t'));
        line = [];
        lastRow = pos.r;
      }
      let v;
      if (c.t === 'n') {
        v = Number.isInteger(c.v) && Math.abs(c.v) < 1e21 ? c.v.toFixed(0) : String(c.v);
      } else if (c.t === 'b') {
        return;
      } else {
        v = String(c.v);
      }
      cells++;
      line.push(v);
    });
    if (line.length) lines.push(line.join('\t'));
  });
  return { text: lines.join('\n'), sheets: wb.SheetNames.length, cells: cells };
}

async function loadFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  try {
    let text, info;
    if (ext === 'txt' || ext === 'csv' || ext === 'tsv') {
      text = await file.text();
      info = file.name + ' loaded';
    } else {
      if (!window.XLSX) throw new Error('The Excel reader did not load. Check your internet connection and reload the page.');
      const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
      const r = workbookToText(wb);
      text = r.text;
      info = file.name + ' loaded · ' + r.sheets + ' sheet' + (r.sheets === 1 ? '' : 's') + ' · ' + r.cells.toLocaleString() + ' cells';
    }
    $('data').value = text;
    setNote(info);
    run();
  } catch (e) {
    setNote('Could not read ' + file.name + '. ' + (e && e.message ? e.message : ''), true);
  }
}

$('zone').addEventListener('click', function () { $('file').click(); });
$('file').addEventListener('change', function (e) {
  loadFile(e.target.files[0]);
  e.target.value = '';
});
$('m-cnic').addEventListener('click', function () { run('cnic'); });
$('m-num').addEventListener('click', function () { run('num'); });
['cnic-fmt', 'num-fmt', 'dedupe'].forEach(function (id) {
  $(id).addEventListener('change', function () {
    if ($('data').value.trim()) run(); else syncMode();
  });
});
$('clear').addEventListener('click', function () {
  $('data').value = '';
  $('out').value = '';
  lastList = [];
  setNote('');
  $('dl-note').textContent = '';
  $('sum').hidden = true;
});
$('data').addEventListener('input', function () { setNote(''); });

const card = $('inCard');
['dragenter', 'dragover'].forEach(function (ev) {
  card.addEventListener(ev, function (e) { e.preventDefault(); card.classList.add('over'); });
});
['dragleave', 'drop'].forEach(function (ev) {
  card.addEventListener(ev, function (e) { e.preventDefault(); card.classList.remove('over'); });
});
card.addEventListener('drop', function (e) {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

let copyTimer;
function flash(msg) {
  const b = $('copy');
  b.textContent = msg;
  clearTimeout(copyTimer);
  copyTimer = setTimeout(function () { b.textContent = 'Copy result'; }, 1600);
}
$('copy').addEventListener('click', async function () {
  const v = $('out').value;
  if (!v) { flash('Nothing to copy'); return; }
  try {
    await navigator.clipboard.writeText(v);
    flash('Copied');
  } catch (e) {
    $('out').select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
    flash(ok ? 'Copied' : 'Press Ctrl+C');
  }
});

/* Excel download: one column, no header, every value stored as text so Excel keeps all digits */
function buildXlsx(list) {
  const ws = XLSX.utils.aoa_to_sheet(list.map(function (v) { return [String(v)]; }));
  ws['!cols'] = [{ wch: 22 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, mode === 'cnic' ? 'CNIC' : 'Numbers');
  return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
}

function plainDownload(buf, filename) {
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function dlNote(msg, isErr) {
  const n = $('dl-note');
  n.textContent = msg || '';
  n.className = 'note' + (isErr ? ' err' : '');
}

$('dl').addEventListener('click', async function () {
  if (!lastList.length) { dlNote('Nothing to download yet. Extract something first.', true); return; }
  if (!window.XLSX) { dlNote('The Excel writer did not load. Check your internet connection and reload the page.', true); return; }
  const filename = (mode === 'cnic' ? 'cnic-list' : 'mobile-numbers') + '.xlsx';
  let buf;
  try { buf = buildXlsx(lastList); } catch (e) { dlNote('Could not build the Excel file.', true); return; }
  let dls = null;
  try { dls = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dls = null; }
  try {
    if (dls) {
      await dls.save({ filename: filename, data: buf });
    } else {
      plainDownload(buf, filename);
    }
    dlNote(filename + ' · ' + lastList.length.toLocaleString() + ' rows');
  } catch (e) {
    if (e && e.code === 'declined') dlNote('Download cancelled.');
    else dlNote('Download was not allowed here. Use the standalone file to download.', true);
  }
});

syncMode();
</script>
